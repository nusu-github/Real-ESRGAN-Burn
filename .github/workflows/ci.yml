name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # LLVM bundle downloaded by the `cuda` feature's build script.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tracel
            ~/.local/share/tracel
          key: tracel-llvm-23.1.0-3-${{ runner.os }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (flex + wgpu)
        run: cargo clippy --all-targets --no-default-features --features flex,wgpu -- -D warnings

      - name: Test
        run: cargo test
