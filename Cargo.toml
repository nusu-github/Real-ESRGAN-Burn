[package]
name = "real-esrgan-burn"
version = "0.1.0"
edition = "2024"
description = "Real-ESRGAN super-resolution inference implemented in Rust with the Burn deep learning framework"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["super-resolution", "esrgan", "burn", "deep-learning", "image-processing"]
categories = ["computer-vision", "multimedia::images"]

[dependencies]
anyhow = "1.0"
burn = { version = "~0.20", default-features = false, features = ["std", "ndarray", "cuda", "fusion"] }
burn-import = { version = "~0.20" }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "=7.0.0"
